name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Wersja z pliku VERSION. Gdy wydanie o tym numerze już istnieje (kolejny merge bez
  # podbicia wersji), dostaje przyrostek z numerem budowania – każdy merge to nowe wydanie.
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wersja
        id: ver
        run: |
          BASE=$(tr -d '[:space:]' < VERSION)
          NAME="$BASE"
          if git rev-parse -q --verify "refs/tags/v$BASE" >/dev/null; then
            NAME="$BASE.${{ github.run_number }}"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Klucz podpisu
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Testy jednostkowe
        run: gradle :app:testGithubDebugUnitTest --stacktrace

      # Lint tylko jako raport – nie blokuje wydania (abortOnError = false w build.gradle.kts).
      - name: Lint
        run: gradle :app:lintGithubDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-raport
          path: app/build/reports/lint-results-githubDebug.*
          if-no-files-found: ignore

      - name: Budowanie APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle :app:assembleGithubRelease -PversionCode=${{ steps.ver.outputs.code }} -PversionName=${{ steps.ver.outputs.name }} --stacktrace

      # Wersja F-Droid tak, jak zbuduje ją F-Droid: bez sekretów i bez parametrów wersji
      # (kod wersji z pliku VERSION), niepodpisana. Sprawdza tylko, że da się ją zbudować.
      - name: Budowanie wersji F-Droid (bez sekretów)
        run: |
          env -u SIGNING_KEYSTORE_PATH -u SIGNING_STORE_PASSWORD -u SIGNING_KEY_PASSWORD -u SIGNING_KEY_ALIAS gradle :app:assembleFdroidRelease --stacktrace
          ls app/build/outputs/apk/fdroid/release/

      - name: Przygotowanie pliku
        run: cp app/build/outputs/apk/github/release/app-github-release.apk "OpenExplorer-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenExplorer-${{ steps.ver.outputs.name }}
          path: OpenExplorer-${{ steps.ver.outputs.name }}.apk

      - name: Publikacja wydania
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.ver.outputs.name }}
          BASE: ${{ steps.ver.outputs.base }}
        run: |
          TAG="v$NAME"
          NOTES=$(awk -v version="$BASE" '$0 == "## " version { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
          if [ "$NAME" != "$BASE" ]; then
            LOG=$(git log -5 --pretty='- %s' "$GITHUB_SHA")
            NOTES=$(printf 'Poprawki i ulepszenia:\n\n%s' "$LOG")
          fi
          FOOTER=$(printf -- '---\n**Android:** pobierz **OpenExplorer-%s.apk** i zainstaluj go na telefonie (Android 8.0+). Kolejne wersje aplikacja pobierze sama.' "$NAME")
          gh release create "$TAG" "OpenExplorer-$NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "OpenExplorer $NAME" \
            --notes "$(printf '%s\n\n%s' "$NOTES" "$FOOTER")" \
            --latest
